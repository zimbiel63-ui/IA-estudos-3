<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar - Estuda IA</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="login">

        <h1>Estuda IA</h1>

        <h2>Entrar na sua conta</h2>

        <form
            action="{{ url_for('login') }}"
            method="POST"
        >

            <input
                type="email"
                name="email"
                placeholder="Seu e-mail"
                required
            >

            <input
                type="password"
                name="senha"
                placeholder="Sua senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <div class="ou">
            ou
        </div>

        <a
            href="{{ url_for('login_google') }}"
            class="google-login"
        >
            Entrar com Google
        </a>

        <p>

            Ainda não possui uma conta?

            <a href="{{ url_for('cadastro') }}">
                Criar conta
            </a>

        </p>

    </div>

</body>

</html>
