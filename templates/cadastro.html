```html
<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar conta - Estuda IA</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="login">

        <h1>Estuda IA</h1>

        <h2>Criar sua conta</h2>

        <form
            action="{{ url_for('cadastro') }}"
            method="POST"
        >

            <input
                type="text"
                name="nome"
                placeholder="Seu nome"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Seu e-mail"
                required
            >

            <input
                type="password"
                name="senha"
                placeholder="Sua senha"
                required
            >

            <input
                type="password"
                name="confirmar_senha"
                placeholder="Confirme sua senha"
                required
            >

            <button type="submit">
                Criar conta
            </button>

        </form>

        <div class="ou">
            ou
        </div>

        <a
            href="{{ url_for('login_google') }}"
            class="google-login"
        >
            Criar conta com Google
        </a>

        <p>

            Já possui uma conta?

            <a href="{{ url_for('login') }}">
                Entrar
            </a>

        </p>

    </div>

</body>

</html>
